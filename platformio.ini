[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2
    me-no-dev/AsyncTCP
    me-no-dev/ESPAsyncWebServer
    adafruit/DHT sensor library
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    ; -D ENABLE_SENSORS       ; Uncomment to enable DHT22 sensor
    ; -D ENABLE_WEATHER       ; Uncomment to enable Open-Meteo weather API
    ; -D ENABLE_GAMES         ; Uncomment to enable mini-games

; ── Wokwi simulation: uses SSD1306 (real hardware uses SH1106)
; Uncomment exactly ONE of the two display lines:
    -D DISPLAY_SSD1306      ; ← Wokwi (web simulator uses SSD1306)
    ; -D DISPLAY_SH1106     ; ← Real hardware (AZ-Delivery 1.3" = SH1106)

board_build.partitions = min_spiffs.csv
